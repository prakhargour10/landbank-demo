services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: landbank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d landbank"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/landbank
      DEMO_MODE: "true"
      SEED_ON_START: "true"
    ports: ["8010:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
